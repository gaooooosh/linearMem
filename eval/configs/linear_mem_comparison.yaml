# Linear Memory Comparison Configuration
# 用于对比 Linear Mem 开启和关闭时的性能差异

# 模型配置
model:
  name: "Qwen/Qwen3-1.7B"
  device: "cuda:7"
  dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  batch_size: 1

# RULER 评测配置
evaluation:
  # 上下文长度配置
  context_length: 32768  # 32K

  # 滑动窗口配置
  sliding_window: 4096   # 4K
  keep_first: 4

  # 样本数量
  num_samples: 100

  # RULER 任务列表
  tasks:
    - "niah_single_1"
    - "niah_single_2"
    - "niah_single_3"
    - "niah_multikey_1"
    - "niah_multivalue"
    - "niah_multiquery"
    - "passkey"
    - "ruler_vt"
    - "ruler_cwe"
    - "ruler_fwe"

  # 生成参数
  generation:
    max_gen_toks: 128
    temperature: 0.0
    top_p: 1.0
    until: ["\n", "</s>", "###"]

# Linear Mem 对比配置
comparison:
  # 启用 Linear Mem 的配置
  enabled:
    enable_linear_mem: true
    name_suffix: "_linear_mem_enabled"

  # 禁用 Linear Mem 的配置
  disabled:
    enable_linear_mem: false
    name_suffix: "_linear_mem_disabled"

# 输出配置
output:
  base_dir: "eval/results"
  save_detailed_results: true
  generate_comparison_report: true
  plot_results: true
