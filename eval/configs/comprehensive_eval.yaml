# =============================================================================
# 多维度评测任务配置
# Comprehensive Multi-Dimensional Evaluation Configuration
# =============================================================================

# 评测分组定义
task_groups:
  # 1. 长文本理解能力 (Long Context Understanding)
  long_context:
    description: "长文本理解与生成能力评估"
    tasks:
      - "passkey"  # Passkey retrieval task
      # Note: 以下任务需要 RULER benchmark,请使用 run_ruler_32k.py
      # - "niah_single_1"  # Needle In A Haystack
      # - "niah_multikey"  # Multi-key retrieval
    max_tokens: 32768  # 需要更长的上下文

  # 2. 常识推理 (Commonsense Reasoning)
  commonsense:
    description: "常识推理能力评估"
    tasks:
      - "hellaswag"
      - "piqa"
      - "winogrande"
      - "openbookqa"
    num_fewshot: 0

  # 3. 知识问答 (Knowledge QA)
  knowledge:
    description: "世界知识与问答能力"
    tasks:
      - "arc_easy"
      - "arc_challenge"
      - "triviaqa"
      - "nq_open"  # Natural Questions
      - "webqs"  # Web Questions
    num_fewshot: 0

  # 4. 真实性与幻觉 (Truthfulness & Hallucination)
  truthfulness:
    description: "回答真实性与幻觉检测"
    tasks:
      - "truthfulqa_mc1"
      - "truthfulqa_mc2"
      - "truthfulqa_gen"
    num_fewshot: 0

  # 5. 数学推理 (Mathematical Reasoning)
  math:
    description: "数学与逻辑推理能力"
    tasks:
      - "gsm8k"
      - "asdiv"  # Arithmetic skills
    num_fewshot: 4

  # 6. 代码能力 (Code Generation)
  code:
    description: "代码生成与理解能力"
    tasks:
      - "humaneval"
      - "mbpp"
    num_fewshot: 0

  # 7. 阅读理解 (Reading Comprehension)
  reading:
    description: "阅读理解能力"
    tasks:
      - "lambada"
      - "lambada_openai"
      - "wikitext"
    num_fewshot: 0

  # 8. 语言建模 (Language Modeling)
  language_modeling:
    description: "基础语言建模能力 (Perplexity)"
    tasks:
      - "wikitext"
      - "pile_arxiv"
      - "pile_github"
      - "pile_stackexchange"
    metric: "perplexity"

# =============================================================================
# 预设评测方案
# =============================================================================

presets:
  # 快速评测 (约30分钟)
  quick:
    description: "快速评测核心能力"
    tasks:
      - "hellaswag"
      - "arc_easy"
      - "truthfulqa_mc1"
      - "gsm8k"
      - "humaneval"

  # 标准评测 (约2-3小时)
  standard:
    description: "标准多维度评测"
    groups:
      - "commonsense"
      - "knowledge"
      - "truthfulness"
      - "math"

  # 全面评测 (约6-8小时)
  comprehensive:
    description: "全面能力评测"
    groups:
      - "long_context"
      - "commonsense"
      - "knowledge"
      - "truthfulness"
      - "math"
      - "reading"

  # 长文本专项 (约1-2小时)
  long_context_focus:
    description: "专注长文本能力评测"
    groups:
      - "long_context"
      - "reading"

# =============================================================================
# 模型配置模板
# =============================================================================

model_defaults:
  # 基础配置
  batch_size: "auto"
  device: "cuda:0"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

  # SWAA 配置
  swaa:
    sliding_window_size: 2048
    keep_first: 4
    force_fa_decode: false
    non_sliding_layers: []

  # 生成配置
  generation:
    max_new_tokens: 256
    temperature: 1.0
    top_p: 1.0
    num_beams: 1
